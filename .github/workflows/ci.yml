name: "Build"

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true
      - name: Build
        run: |
          sudo apt-get update -y && sudo apt-get install -y wget unzip file git openjdk-17-jdk
          git submodule foreach git submodule update --init
          wget https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          mkdir sdk
          unzip -d sdk commandlinetools-linux-13114758_latest.zip
          export ANDROID_HOME=`pwd`/sdk
          export ANDROID_SDK_ROOT=`pwd`/sdk
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          yes | sdk/cmdline-tools/bin/sdkmanager --sdk_root=`pwd`/sdk --licenses
          ./gradlew assembleRelease
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ref_name="pr-${{ github.event.pull_request.number }}"
          else
            ref_name="${{ github.ref_name }}"
          fi
          echo "ref_name=${ref_name}" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/hev.sockstun-*-release.apk hev.sockstun-${ref_name}-release.apk
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hev.sockstun-${{ env.ref_name }}-release.apk
          path: hev.sockstun-${{ env.ref_name }}-release.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: "hev.sockstun-*"
          merge-multiple: true
      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in release/hev.sockstun-*; do
            gh release upload ${{ github.event.release.tag_name }} $i
          done

  snapshot:
    name: Snapshot
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: "hev.sockstun-*"
          merge-multiple: true
      - name: Update snapshot tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f snapshot ${{ github.sha }}
          git push -f origin refs/tags/snapshot
      - name: Publish snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          if [ -n "${LAST}" ]; then
            NOTES="Full Changelog: https://github.com/${{ github.repository }}/compare/${LAST}...snapshot"
          else
            NOTES="Full Changelog: https://github.com/${{ github.repository }}/commits/snapshot"
          fi
          gh release delete snapshot --yes || true
          gh release create snapshot --prerelease --verify-tag \
            --title snapshot --notes "${NOTES}" release/hev.sockstun-*
